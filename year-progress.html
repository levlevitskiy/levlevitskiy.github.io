<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <title>Year Progress</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --future: #e6e6e6;
      --today: #3b82f6;
      --card-bg: #fafafa;
      --card-border: #dddddd;
      --past: #111111;
      --cell-size: 12px;
      --gap: 4px;
    }

    html[data-theme="dark"] {
      --bg: #050505;
      --text: #ffffff;
      --muted: #8b8b8b;
      --future: #252525;
      --card-bg: #0d0d0d;
      --card-border: #1d1d1d;
      --past: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 760px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .date {
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(15px, 3.5vw, 18px);
      text-transform: capitalize;
    }

    .intro {
      max-width: 620px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 32px auto 28px;
      max-width: 560px;
    }

    .stat {
      padding: 18px 16px;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      background: var(--card-bg);
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .grid-wrap {
      width: 100%;
      overflow-x: auto;
      padding: 4px 0 10px;
      -webkit-overflow-scrolling: touch;
    }

    .year-grid {
      display: grid;
      grid-template-rows: repeat(12, var(--cell-size));
      grid-auto-flow: column;
      grid-auto-columns: var(--cell-size);
      gap: var(--gap);
      justify-content: center;
      width: max-content;
      min-width: 100%;
    }

    .day {
      width: var(--cell-size);
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--future);
      transition: transform .15s ease, opacity .15s ease;
    }

    .day:hover { transform: scale(1.35); }
    .day.past { background: var(--past); }
    .day.today {
      background: var(--today);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .2), 0 0 18px rgba(59, 130, 246, .5);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--future);
    }

    .legend-dot.past { background: var(--past); }
    .legend-dot.today { background: var(--today); }

    .site-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .site-link:hover { color: var(--text); }


    body,
    .stat,
    .day,
    .legend-dot,
    .theme-toggle {
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 21px;
      cursor: pointer;
      z-index: 10;
    }

    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:active { transform: translateY(0); }


    .orientation-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 21px;
      cursor: pointer;
      z-index: 10;
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }

    .orientation-toggle:hover { transform: translateY(-1px); }
    .orientation-toggle:active { transform: translateY(0); }

    .year-grid.horizontal-fill {
      grid-template-rows: none;
      grid-template-columns: repeat(31, var(--cell-size));
      grid-auto-flow: row;
      grid-auto-rows: var(--cell-size);
    }

    .year-grid.vertical-fill {
      grid-template-rows: repeat(12, var(--cell-size));
      grid-template-columns: none;
      grid-auto-flow: column;
      grid-auto-columns: var(--cell-size);
    }

    @media (max-width: 560px) {
      body { padding: 18px 12px; }
      .stats { grid-template-columns: 1fr; gap: 10px; }
      .stat { padding: 15px 14px; }
      :root { --cell-size: 9px; --gap: 3px; }
    }

    @media (max-width: 390px) {
      :root { --cell-size: 8px; --gap: 2.5px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
    <span id="themeIcon" aria-hidden="true">🌙</span>
  </button>
  <main class="app">
    <h1 id="title">Прогресс года</h1>
    <p class="date" id="currentDate">Календарь текущего года</p>
    <p class="intro">Узнайте, сколько дней и процентов года уже прошло, сколько осталось, и оцените прогресс на наглядной шкале.</p>

    <section class="stats" aria-label="Статистика года">
      <div class="stat">
        <span class="stat-label">Прошло</span>
        <span class="stat-value" id="passedStat"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Осталось</span>
        <span class="stat-value" id="remainingStat"></span>
      </div>
    </section>

    <div class="grid-wrap">
      <div class="year-grid vertical-fill" id="yearGrid" aria-label="Прогресс года по дням"></div>
    </div>

    <button class="orientation-toggle" id="orientationToggle" type="button" aria-label="Переключить направление заполнения" title="Переключить направление заполнения">
    <span id="orientationIcon" aria-hidden="true">↕️</span>
  </button>

    <div class="legend" aria-hidden="true">
      <span class="legend-item"><span class="legend-dot past"></span>Прошедшие дни</span>
      <span class="legend-item"><span class="legend-dot today"></span>Сегодня</span>
      <span class="legend-item"><span class="legend-dot"></span>Будущие дни</span>
    </div>

    <a class="site-link" href="/">← На главную</a>
  </main>

  <script>
    function getDayWord(number) {
      const absNumber = Math.abs(number) % 100;
      const lastDigit = absNumber % 10;

      if (absNumber >= 11 && absNumber <= 14) return 'дней';
      if (lastDigit === 1) return 'день';
      if (lastDigit >= 2 && lastDigit <= 4) return 'дня';
      return 'дней';
    }

    function renderYearProgress() {
      const now = new Date();
      const year = now.getFullYear();
      const startOfYear = new Date(year, 0, 1);
      const startOfNextYear = new Date(year + 1, 0, 1);
      const msPerDay = 24 * 60 * 60 * 1000;

      const totalDays = Math.round((startOfNextYear - startOfYear) / msPerDay);
      const passedDays = Math.floor((now - startOfYear) / msPerDay) + 1;
      const remainingDays = totalDays - passedDays;

      const passedPercent = (passedDays / totalDays * 100).toFixed(1).replace('.', ',');
      const remainingPercent = (remainingDays / totalDays * 100).toFixed(1).replace('.', ',');

      document.getElementById('title').textContent = `Прогресс года: ${year}`;
      const weekday = now.toLocaleDateString('ru-RU', { weekday: 'long' }).toLowerCase();
      const fullDate = now.toLocaleDateString('ru-RU', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).replace(/\s*г\.$/, '');
      document.getElementById('currentDate').textContent = `${weekday}, ${fullDate}`;
      document.getElementById('passedStat').textContent = `${passedDays} ${getDayWord(passedDays)} (${passedPercent}%)`;
      document.getElementById('remainingStat').textContent = `${remainingDays} ${getDayWord(remainingDays)} (${remainingPercent}%)`;

      const grid = document.getElementById('yearGrid');
      grid.innerHTML = '';

      for (let dayNumber = 1; dayNumber <= totalDays; dayNumber++) {
        const cell = document.createElement('div');
        cell.className = 'day';

        const date = new Date(year, 0, dayNumber);
        cell.title = date.toLocaleDateString('ru-RU', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });

        if (dayNumber < passedDays) {
          cell.classList.add('past');
        } else if (dayNumber === passedDays) {
          cell.classList.add('today');
          cell.setAttribute('aria-current', 'date');
        }

        grid.appendChild(cell);
      }
    }


    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const savedTheme = localStorage.getItem('year-progress-theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute(
        'aria-label',
        theme === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'
      );
      themeToggle.title = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    }

    applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('year-progress-theme', nextTheme);
      applyTheme(nextTheme);
    });


    const grid = document.getElementById('yearGrid');
    const orientationToggle = document.getElementById('orientationToggle');
    const orientationIcon = document.getElementById('orientationIcon');
        const savedOrientation = localStorage.getItem('year-progress-orientation') || 'vertical';

    function applyOrientation(orientation) {
      grid.classList.remove('vertical-fill', 'horizontal-fill');
      grid.classList.add(orientation === 'horizontal' ? 'horizontal-fill' : 'vertical-fill');

      const isHorizontal = orientation === 'horizontal';
      orientationIcon.textContent = isHorizontal ? '↔️' : '↕️';
      
      orientationToggle.title = isHorizontal
        ? 'Переключить на вертикальное заполнение'
        : 'Переключить на горизонтальное заполнение';
      orientationToggle.setAttribute(
        'aria-label',
        isHorizontal
          ? 'Переключить на вертикальное заполнение'
          : 'Переключить на горизонтальное заполнение'
      );
    }

    applyOrientation(savedOrientation);

    orientationToggle.addEventListener('click', () => {
      const nextOrientation = grid.classList.contains('horizontal-fill')
        ? 'vertical'
        : 'horizontal';
      localStorage.setItem('year-progress-orientation', nextOrientation);
      applyOrientation(nextOrientation);
    });

    renderYearProgress();

    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 0 && now.getMinutes() === 0) {
        renderYearProgress();
      }
    }, 60000);
  </script>
</body>
</html>
